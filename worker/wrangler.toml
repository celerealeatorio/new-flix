name = "new-flix-api"
main = "index.js"
compatibility_date = "2024-11-01"

[vars]
# Origem do site publicado (CORS). Adicione outras origens separadas por vírgula se necessário.
ALLOWED_ORIGINS = "https://celerealeatorio.github.io"
