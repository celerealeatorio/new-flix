<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>NEWFLIX — IPTV Player</title>
<meta name="description" content="Player de IPTV com acesso controlado por usuário e tempo.">
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #0a0a0a;
    --panel: #141414;
    --panel-2: #1f1f1f;
    --border: #2a2a2a;
    --text: #ffffff;
    --muted: #b3b3b3;
    --red: #e50914;
    --red-dark: #b20710;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
  }

  #loginScreen {
    position: fixed; inset: 0; z-index: 100;
    background: radial-gradient(ellipse at 50% 0%, rgba(229,9,20,.12), transparent 60%), var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  #loginScreen.hidden { display: none; }
  .login-card {
    background: rgba(20,20,20,.92); border: 1px solid var(--border); border-top: 3px solid var(--red);
    border-radius: 10px; padding: 32px 28px; width: 100%; max-width: 400px;
    box-shadow: 0 20px 60px rgba(0,0,0,.7);
  }
  .logo { font-size: 1.6rem; font-weight: 900; letter-spacing: 4px; color: var(--red); text-transform: uppercase; }
  .logo small { display: block; font-size: .65rem; letter-spacing: 3px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  .login-card .sub { color: var(--muted); font-size: 0.85rem; margin: 14px 0 6px; }
  .login-card label { display: block; font-size: 0.78rem; color: var(--muted); margin: 12px 0 5px; text-transform: uppercase; letter-spacing: 1px; }
  .login-card input {
    width: 100%; padding: 13px; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 6px; color: var(--text); font-size: 16px; outline: none;
  }
  .login-card input:focus { border-color: var(--red); }
  .login-card button {
    width: 100%; padding: 13px; margin-top: 18px; border: none; border-radius: 6px;
    background: var(--red); color: #fff; font-size: 1rem; font-weight: 700; cursor: pointer;
    letter-spacing: 1px; text-transform: uppercase;
  }
  .login-card button:hover { background: var(--red-dark); }
  .login-card button:disabled { opacity: .6; cursor: wait; }
  #loginStatus { font-size: 0.85rem; margin-top: 12px; min-height: 1.2em; }
  #loginStatus.err { color: var(--red); font-weight: 600; }

  .topbar {
    position: sticky; top: 0; z-index: 40; background: rgba(10,10,10,.95);
    border-bottom: 2px solid var(--red); backdrop-filter: blur(8px);
  }
  .topbar-inner {
    max-width: 1400px; margin: 0 auto; padding: 12px 16px;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .topbar .logo { font-size: 1.25rem; }
  .topbar .logo small { display: none; }
  .badge {
    font-size: 0.78rem; color: var(--muted); background: var(--panel); border: 1px solid var(--border);
    padding: 7px 12px; border-radius: 20px;
  }
  .badge b { color: var(--text); }
  .badge.timer { color: var(--text); border-color: var(--red); }
  .badge.timer.warn { color: var(--red); font-weight: 700; }

  .container { max-width: 1400px; margin: 0 auto; padding: 14px 16px 60px; }
  #appRoot.hidden, .hidden { display: none; }

  .load-panel {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--red);
    border-radius: 8px; padding: 16px; margin-bottom: 14px;
  }
  .load-panel h2 { font-size: 0.95rem; margin-bottom: 12px; }
  .load-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .load-row input[type=text] {
    flex: 1; min-width: 200px; padding: 11px 12px; background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 6px; color: var(--text);
    font-size: 14px; outline: none;
  }
  .load-row input:focus { border-color: var(--red); }
  .btn {
    padding: 11px 16px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 0.88rem;
    font-weight: 600; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { border-color: var(--red); color: var(--red); }
  .btn.primary { background: var(--red); border-color: var(--red); color: #fff; }
  .btn.primary:hover { background: var(--red-dark); color: #fff; }
  .load-status { font-size: 0.8rem; color: var(--muted); margin-top: 10px; min-height: 1em; }
  .load-status.err { color: var(--red); }
  .load-status.ok { color: #46d369; }

  .player-panel {
    position: sticky; top: calc(var(--topbar-h, 60px)); z-index: 30;
    background: var(--bg); margin-bottom: 14px; padding-top: 4px;
  }
  .video-wrap { transition: max-height .25s ease, height .25s ease; }
  .play-status {
    position: absolute; left: 10px; bottom: 10px; z-index: 5;
    background: rgba(0,0,0,.7); color: var(--muted); font-size: 0.72rem;
    padding: 4px 10px; border-radius: 12px; pointer-events: none; max-width: 80%;
  }
  .play-status.err { color: #ff6b6b; }
  .play-status.ok { color: #46d369; }
  .video-wrap {
    position: relative; background: #000; border-radius: 10px; overflow: hidden;
    aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); max-height: 60vh;
  }
  .player-panel.mini .video-wrap { aspect-ratio: auto; height: 170px; max-height: 170px; }
  .mini-toggle {
    position: absolute; top: 8px; right: 8px; z-index: 6;
    background: rgba(0,0,0,.7); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; min-width: 38px; height: 32px; cursor: pointer; font-size: 0.95rem;
  }
  .mini-toggle:hover { border-color: var(--red); color: var(--red); }
  .video-wrap video { width: 100%; height: 100%; background: #000; }
  .video-wrap .placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(ellipse at 50% 40%, rgba(229,9,20,.16), transparent 65%), #000;
    width: 100%; height: 100%;
  }
  .video-wrap .placeholder .idle-logo {
    font-size: clamp(1.6rem, 5vw, 3rem); font-weight: 900; letter-spacing: 8px;
    color: var(--red); text-transform: uppercase;
    text-shadow: 0 0 30px rgba(229,9,20,.45);
  }
  .video-wrap .placeholder .idle-sub { color: #555; font-size: 0.8rem; letter-spacing: 3px; text-transform: uppercase; }
  #ytFrame {
    position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: none;
  }

  #busca {
    width: 100%; padding: 13px 14px; margin: 10px 0 2px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-size: 16px; outline: none;
  }
  #busca:focus { border-color: var(--red); }

  .ch-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px;
  }
  .ch-card {
    position: relative; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden; cursor: pointer; transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .ch-card:hover {
    transform: scale(1.04); border-color: var(--red);
    box-shadow: 0 8px 24px rgba(229,9,20,.25); z-index: 2;
  }
  .ch-card.active { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); }
  .ch-card .thumb {
    aspect-ratio: 16 / 9; background: linear-gradient(135deg, #1a1a1a, #101010);
    display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 10px;
  }
  .ch-card .thumb img { max-width: 80%; max-height: 80%; object-fit: contain; }
  .ch-card .thumb .no-logo { color: #444; font-size: 1.6rem; }
  .ch-card .txt { padding: 10px 12px 12px; border-top: 2px solid var(--red); }
  .ch-card .txt .name {
    font-size: 0.85rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .ch-card .txt .group { font-size: 0.7rem; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-card .fav {
    position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.6); border: none;
    color: var(--muted); font-size: 1rem; cursor: pointer; padding: 5px 7px; border-radius: 6px; z-index: 3;
  }
  .ch-card .fav.on { color: var(--red); }
  .empty-list { text-align: center; color: var(--muted); padding: 60px 16px; font-size: 0.95rem; grid-column: 1 / -1; }

  .toast {
    position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--red); color: var(--text);
    padding: 12px 20px; border-radius: 8px; font-size: 0.9rem; opacity: 0;
    transition: opacity .25s; pointer-events: none; z-index: 60; max-width: 90vw;
  }
  .toast.show { opacity: 1; }
  #installBtn { display: none; }
  footer { margin-top: 30px; margin-bottom: 70px; font-size: 0.75rem; color: #555; text-align: center; line-height: 1.6; }

  .bottombar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; justify-content: space-around; align-items: center; gap: 4px;
    background: rgba(10,10,10,.97); border-top: 2px solid var(--red);
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter: blur(8px);
  }
  .bottombar button {
    background: none; border: none; color: var(--muted); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 0.62rem; padding: 4px 8px; letter-spacing: .5px;
  }
  .bottombar button .ico { font-size: 1.15rem; }
  .bottombar button:hover { color: var(--red); }
  .bottombar button.on { color: var(--red); }
  .bottombar .badge.timer { font-size: 0.68rem; padding: 4px 10px; }

  @media (min-width: 701px) {
    .container {
      display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr);
      gap: 18px; align-items: start;
    }
    .player-panel { position: sticky; }
    .ch-grid {
      max-height: calc(100vh - var(--topbar-h, 60px) - 30px);
      overflow-y: auto; padding-right: 4px;
    }
    .ch-grid::-webkit-scrollbar { width: 8px; }
    .ch-grid::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  }

  @media (max-width: 700px) {
    .container { padding: 10px 10px 90px; }
    .ch-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
    .ch-card .txt .name { font-size: 0.8rem; }
    .topbar-inner { padding: 10px 10px; }
    .btn { padding: 12px 14px; font-size: 0.9rem; }
    .video-wrap { max-height: none; border-radius: 0; border-left: 0; border-right: 0; aspect-ratio: 16 / 11; }
    .player-panel.mini .video-wrap { height: 140px; max-height: 140px; }
    .bottombar button { font-size: 0.58rem; padding: 4px 6px; }
    .bottombar button .ico { font-size: 1.05rem; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <div class="logo">Newflix<small>iptv player · acesso restrito</small></div>
    <div class="sub">Entre com o usuário e a chave fornecidos pelo administrador.</div>
    <form id="loginForm">
      <label for="loginUsuario">Usuário</label>
      <input type="text" id="loginUsuario" autocomplete="username" required>
      <label for="loginChave">Chave de acesso</label>
      <input type="password" id="loginChave" autocomplete="current-password" required>
      <button type="submit" id="btnLogin">Entrar</button>
      <div id="loginStatus"></div>
    </form>
  </div>
</div>

<div class="hidden" id="appRoot">
  <div class="topbar">
    <div class="topbar-inner">
      <div class="logo">Newflix</div>
    </div>
  </div>

  <div class="container">
    <div class="player-panel">
      <div class="video-wrap" id="videoWrap">
        <video id="video" controls playsinline autoplay></video>
        <iframe id="ytFrame" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
        <div class="placeholder" id="placeholder">
          <div class="idle-logo">Newflix</div>
          <div class="idle-sub">IPTV ao vivo</div>
        </div>
        <div class="play-status" id="playStatus"></div>
        <button class="mini-toggle" id="btnMini" title="Minimizar / ampliar player">⬆</button>
      </div>
      <input type="text" id="busca" placeholder="🔍 Buscar canal..." autocomplete="off">
    </div>

    <div class="ch-grid" id="chGrid"></div>
  </div>

  <div class="bottombar">
    <span class="badge timer hidden" id="badgeTimer"></span>
    <button id="btnFilmes"><span class="ico">🎬</span>Filmes</button>
    <button id="btnFavoritos"><span class="ico">⭐</span>Favoritos</button>
    <button id="btnFull"><span class="ico">⛶</span>Tela cheia</button>
    <button id="btnCast" style="display:none"><span class="ico">📡</span>Transmitir</button>
    <button id="btnAtualizar"><span class="ico">🔄</span>Atualizar</button>
    <button id="btnSair"><span class="ico">🚪</span>Sair</button>
    <button id="installBtn" style="display:none"><span class="ico">📲</span>Instalar</button>
  </div>

  <footer>
    NEWFLIX · Acesso controlado por usuário e tempo · Reproduza apenas conteúdo legal
  </footer>
</div>
<div class="toast" id="toast"></div>

<script src="crypto.js"></script>
<script src="oficiais.js"></script>
<script src="usuarios.js"></script>
<script src="vendor/hls.min.js"></script>
<script>
(function () {
  'use strict';

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
    if (navigator.serviceWorker.controller) {
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        location.reload();
      });
    }
  }

  document.getElementById('btnAtualizar').addEventListener('click', function () {
    toast('⏳ Buscando atualizações...');
    if (!('serviceWorker' in navigator)) { location.reload(); return; }
    navigator.serviceWorker.getRegistration().then(function (reg) {
      if (reg) {
        reg.update().catch(function () {});
        setTimeout(function () { location.reload(); }, 1200);
      } else {
        location.reload();
      }
    }).catch(function () { location.reload(); });
  });

  var deferredPrompt = null;
  var installBtn = document.getElementById('installBtn');
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = 'flex';
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () {
      deferredPrompt = null;
      installBtn.style.display = 'none';
    });
  });

  var LS = { favs: 'iptv:favoritos', rec: 'iptv:recentes', users: 'iptv:usuarios-locais' };
  var SESSAO = 'iptv:session';
  function lsGet(k, def) {
    try { return JSON.parse(localStorage.getItem(k)) || def; } catch (e) { return def; }
  }
  function lsSet(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

  var canais = [];
  var favoritos = lsGet(LS.favs, []);
  var recentes = lsGet(LS.rec, []);
  var soFavoritos = false;
  var hls = null;
  var canalAtual = null;
  var expiraEm = null;
  var timerInterval = null;
  var bloqueado = false;

  var video = document.getElementById('video');
  var ytFrame = document.getElementById('ytFrame');
  var placeholder = document.getElementById('placeholder');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._h);
    t._h = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }
  function loginStatus(msg, cls) {
    var el = document.getElementById('loginStatus');
    el.textContent = msg;
    el.className = cls || '';
  }
  function fmtTempo(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), seg = s % 60;
    var txt = (h > 0 ? h + 'h ' : '') + (h > 0 || m > 0 ? m + 'min ' : '') + (h > 0 ? '' : seg + 's');
    return txt.trim();
  }

  function parseM3U(texto) {
    var linhas = texto.split(/\r?\n/);
    var out = [];
    var atual = null;
    for (var i = 0; i < linhas.length; i++) {
      var linha = linhas[i].trim();
      if (!linha) continue;
      if (linha.indexOf('#EXTINF') === 0) {
        var virgula = linha.indexOf(',');
        var nome = virgula >= 0 ? linha.slice(virgula + 1).trim() : 'Canal';
        var attrs = {};
        var attrPart = virgula >= 0 ? linha.slice(0, virgula) : linha;
        var re = /([a-zA-Z0-9_-]+)="([^"]*)"/g;
        var m;
        while ((m = re.exec(attrPart)) !== null) attrs[m[1].toLowerCase()] = m[2];
        atual = { nome: nome, logo: attrs['tvg-logo'] || '', grupo: attrs['group-title'] || 'Sem grupo', url: '' };
      } else if (linha.charAt(0) !== '#') {
        if (atual) {
          atual.url = linha;
          if (/^https?:\/\//i.test(linha) || /^yt:/i.test(linha)) out.push(atual);
          atual = null;
        }
      }
    }
    return out;
  }

  function baixar(url) {
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' em ' + url);
      return r.text();
    });
  }

  function definirCanais(lista) {
    canais = lista;
    renderGrid();
  }

  function bloquear(msg) {
    bloqueado = true;
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    limparPlayer();
    sessionStorage.removeItem(SESSAO);
    document.getElementById('appRoot').className = 'hidden';
    document.getElementById('loginScreen').className = '';
    document.getElementById('loginChave').value = '';
    loginStatus('⛔ ' + msg, 'err');
  }

  function iniciarTimer() {
    var badge = document.getElementById('badgeTimer');
    if (!expiraEm) { badge.className = 'badge timer hidden'; return; }
    badge.className = 'badge timer';
    function tick() {
      var restante = expiraEm - Date.now();
      if (restante <= 0) {
        bloquear('Seu tempo de acesso expirou. Fale com o administrador.');
        return;
      }
      badge.textContent = '⏳ ' + fmtTempo(restante);
      badge.className = 'badge timer' + (restante < 5 * 60000 ? ' warn' : '');
    }
    tick();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(tick, 1000);
  }

  function todasEntradas() {
    var mapa = {};
    lsGet(LS.users, []).forEach(function (e) { mapa[String(e.usuario).toLowerCase()] = e; });
    (window.USUARIOS || []).forEach(function (e) { mapa[String(e.usuario).toLowerCase()] = e; });
    return Object.keys(mapa).map(function (k) { return mapa[k]; });
  }

  function importarConvite() {
    var m = location.hash.match(/[#&]u=([A-Za-z0-9_-]+)/);
    if (!m) return;
    try {
      var bin = atob(m[1].replace(/-/g, '+').replace(/_/g, '/'));
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var entrada = JSON.parse(new TextDecoder().decode(bytes));
      if (!entrada || !entrada.usuario || !entrada.dados || !entrada.salt || !entrada.iv) throw new Error('formato');
      var locais = lsGet(LS.users, []).filter(function (e) {
        return String(e.usuario).toLowerCase() !== String(entrada.usuario).toLowerCase();
      });
      locais.push(entrada);
      lsSet(LS.users, locais);
      document.getElementById('loginUsuario').value = entrada.usuario;
      toast('✅ Usuário "' + entrada.usuario + '" adicionado neste aparelho. Entre com a sua chave.');
    } catch (e) {
      toast('⚠️ Link de convite inválido.');
    }
    history.replaceState(null, '', location.pathname + location.search);
  }
  importarConvite();

  function entrar(usuario, chave, salvarSessao) {
    var lista = todasEntradas();
    var entrada = null;
    for (var i = 0; i < lista.length; i++) {
      if (String(lista[i].usuario).toLowerCase() === usuario.toLowerCase()) { entrada = lista[i]; break; }
    }
    if (!entrada) {
      return Promise.reject(new Error('Usuário não encontrado neste aparelho. Peça ao administrador o link de convite (🔗 no painel admin).'));
    }
    return IptvCrypto.descriptografar(entrada, chave).then(function (texto) {
      var dados = JSON.parse(texto);
      if (dados.expiraEm && Date.now() > dados.expiraEm) {
        throw new Error('EXPIRADO');
      }
      var base = (dados.canais || []).slice();
      var promessaListas = Promise.resolve();
      if (dados.admin && dados.playlists && dados.playlists.length) {
        promessaListas = Promise.all(dados.playlists.map(function (p) {
          return baixar(p.url).then(function (txt) {
            return { nome: p.nome, canais: parseM3U(txt) };
          }).catch(function () { return null; });
        })).then(function (rs) {
          rs.forEach(function (r) {
            if (!r) return;
            r.canais.forEach(function (c) {
              c.grupo = r.nome + (c.grupo && c.grupo !== 'Sem grupo' ? ' · ' + c.grupo : '');
              base.push(c);
            });
          });
        });
      }
      return promessaListas.then(function () {
        if (!base.length) throw new Error('SEM_CANAIS');
        definirCanais(base);
        expiraEm = dados.expiraEm || null;
        document.getElementById('appRoot').className = '';
        medirTopbar();
        document.getElementById('loginScreen').className = 'hidden';
        iniciarTimer();
        if (salvarSessao) {
          sessionStorage.setItem(SESSAO, JSON.stringify({ usuario: usuario, chave: chave }));
        }
        toast('📺 ' + base.length + ' canais liberados. Bom filme!');
      });
    });
  }

  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var usuario = document.getElementById('loginUsuario').value.trim();
    var chave = document.getElementById('loginChave').value;
    var btn = document.getElementById('btnLogin');
    if (!usuario || !chave || bloqueado) return;
    btn.disabled = true;
    loginStatus('⏳ Verificando acesso...');
    entrar(usuario, chave, true).catch(function (err) {
      if (err.message === 'EXPIRADO') {
        loginStatus('⛔ Seu acesso expirou. Fale com o administrador.', 'err');
      } else if (err.message === 'SEM_CANAIS') {
        loginStatus('⛔ Nenhum canal liberado para este usuário.', 'err');
      } else if (err.name === 'OperationError') {
        loginStatus('❌ Chave incorreta para o usuário "' + usuario + '".', 'err');
      } else if (err instanceof SyntaxError) {
        loginStatus('❌ Dados do usuário corrompidos. Avise o administrador.', 'err');
      } else {
        loginStatus('❌ ' + err.message, 'err');
      }
    }).then(function () { btn.disabled = false; });
  });

  document.getElementById('btnSair').addEventListener('click', function () {
    sessionStorage.removeItem(SESSAO);
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    limparPlayer();
    placeholder.style.display = 'flex';
    document.getElementById('appRoot').className = 'hidden';
    document.getElementById('loginScreen').className = '';
    document.getElementById('loginChave').value = '';
    loginStatus('');
  });

  document.getElementById('btnFilmes').addEventListener('click', function () {
    window.location.href = 'filmes.html';
  });

  var sessao = null;
  try { sessao = JSON.parse(sessionStorage.getItem(SESSAO)); } catch (e) {}
  if (sessao && sessao.usuario) {
    loginStatus('⏳ Restaurando sessão...');
    entrar(sessao.usuario, sessao.chave, false).catch(function () {
      loginStatus('');
    });
  }

  function renderGrid() {
    var grid = document.getElementById('chGrid');
    var busca = document.getElementById('busca').value.toLowerCase().trim();

    var base = soFavoritos
      ? canais.filter(function (c) { return favoritos.indexOf(c.url) !== -1; })
      : canais;

    var filtrados = base.filter(function (c) {
      if (busca && c.nome.toLowerCase().indexOf(busca) === -1) return false;
      return true;
    });

    if (!filtrados.length) {
      var msg = soFavoritos ? 'Nenhum favorito ainda — toque na ⭐ de um canal.' : 'Nenhum canal encontrado.';
      grid.innerHTML = '<div class="empty-list">' + msg + '</div>';
      return;
    }

    grid.innerHTML = filtrados.map(function (c) {
      var fav = favoritos.indexOf(c.url) !== -1;
      var ativo = canalAtual && canalAtual.url === c.url;
      var thumb = c.logo
        ? '<img src="' + esc(c.logo) + '" alt="" loading="lazy" onerror="this.innerHTML=\'<span class=\\\'no-logo\\\'>📺</span>\'">'
        : '<span class="no-logo">📺</span>';
      return '<div class="ch-card' + (ativo ? ' active' : '') + '" data-url="' + esc(c.url) + '">' +
        '<button class="fav' + (fav ? ' on' : '') + '" data-fav="1" title="Favoritar">' + (fav ? '★' : '☆') + '</button>' +
        '<div class="thumb">' + thumb + '</div>' +
        '<div class="txt"><div class="name">' + esc(c.nome) + '</div>' +
        '<div class="group">' + esc(c.grupo) + '</div></div>' +
        '</div>';
    }).join('');
  }

  function isYouTube(url) { return /^yt:/i.test(url); }
  function ytEmbed(url) {
    var ch = url.replace(/^yt:/i, '');
    return 'https://www.youtube.com/embed/live_stream?channel=' + encodeURIComponent(ch) + '&autoplay=1';
  }

  function tocar(canal) {
    canalAtual = canal;
    placeholder.style.display = 'none';
    setStatus('');
    limparPlayer();
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: canal.nome, artist: 'NEWFLIX' });
        navigator.mediaSession.setActionHandler('play', function () { video.play(); });
        navigator.mediaSession.setActionHandler('pause', function () { video.pause(); });
      } catch (e) {}
    }

    var url = canal.url;

    if (isYouTube(url)) {
      video.style.display = 'none';
      ytFrame.style.display = 'block';
      ytFrame.src = ytEmbed(url);
      setStatus('▶ Reproduzindo (YouTube oficial)', 'ok');
    } else {
      video.style.display = 'block';
      var isHls = /\.m3u8(\?|$)/i.test(url) || /m3u8/i.test(url);
      if (isHls && window.Hls && Hls.isSupported()) {
        hls = new Hls({ manifestLoadingTimeOut: 15000, manifestLoadingMaxRetry: 2 });
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.ERROR, function (evt, data) {
          if (data && data.fatal) {
            setStatus('Erro ao reproduzir (stream indisponível ou bloqueado).', 'err');
          }
        });
      } else {
        video.src = url;
        video.play().catch(function () {
          setStatus('Toque em ▶ para reproduzir.', '');
        });
      }
    }

    recentes = [canal.url].concat(recentes.filter(function (u) { return u !== canal.url; })).slice(0, 30);
    lsSet(LS.rec, recentes);
    renderGrid();
  }

  function setStatus(msg, cls) {
    var el = document.getElementById('playStatus');
    el.textContent = msg;
    el.className = 'play-status' + (cls ? ' ' + cls : '');
  }

  function limparPlayer() {
    if (hls) { hls.destroy(); hls = null; }
    video.removeAttribute('src');
    try { video.load(); } catch (e) {}
    ytFrame.src = '';
    ytFrame.style.display = 'none';
    video.style.display = 'block';
  }

  document.getElementById('chGrid').addEventListener('click', function (e) {
    var favBtn = e.target.closest('.fav');
    var card = e.target.closest('.ch-card');
    if (!card) return;
    var url = card.getAttribute('data-url');
    if (favBtn) {
      var idx = favoritos.indexOf(url);
      if (idx === -1) favoritos.push(url); else favoritos.splice(idx, 1);
      lsSet(LS.favs, favoritos);
      renderGrid();
      return;
    }
    var canal = null;
    for (var i = 0; i < canais.length; i++) {
      if (canais[i].url === url) { canal = canais[i]; break; }
    }
    if (canal) tocar(canal);
  });

  var topbar = document.querySelector('.topbar');
  function medirTopbar() {
    if (!topbar) return;
    document.documentElement.style.setProperty('--topbar-h', topbar.offsetHeight + 'px');
  }
  window.addEventListener('resize', medirTopbar);
  if ('ResizeObserver' in window) new ResizeObserver(medirTopbar).observe(topbar);

  var playerPanel = document.querySelector('.player-panel');
  var btnMini = document.getElementById('btnMini');
  function setMini(on) {
    playerPanel.className = 'player-panel' + (on ? ' mini' : '');
    btnMini.textContent = on ? '⬇' : '⬆';
  }
  btnMini.addEventListener('click', function () {
    setMini(playerPanel.className.indexOf('mini') === -1);
  });
  var ultimoScroll = 0;
  window.addEventListener('scroll', function () {
    var y = window.pageYOffset || document.documentElement.scrollTop;
    if (y > 320 && y > ultimoScroll) setMini(true);
    else if (y < 60) setMini(false);
    ultimoScroll = y;
  }, { passive: true });

  document.getElementById('busca').addEventListener('input', renderGrid);

  document.getElementById('btnFavoritos').addEventListener('click', function () {
    soFavoritos = !soFavoritos;
    this.className = soFavoritos ? 'on' : '';
    renderGrid();
    toast(soFavoritos ? '⭐ Mostrando só os favoritos' : 'Mostrando todos os canais');
  });

  if ('remote' in video && 'RemotePlayback' in window) {
    var btnCast = document.getElementById('btnCast');
    btnCast.style.display = 'flex';
    btnCast.addEventListener('click', function () {
      if (isYouTube(canalAtual ? canalAtual.url : '')) {
        toast('📡 Para canais do YouTube, use o botão de transmitir dentro do próprio player.');
        return;
      }
      try {
        video.remote.prompt();
      } catch (e) {
        toast('Nenhum dispositivo encontrado na rede WiFi.');
      }
    });
  }

  document.getElementById('btnFull').addEventListener('click', function () {
    var wrap = document.getElementById('videoWrap');
    if (isYouTube(canalAtual ? canalAtual.url : '')) {
      if (ytFrame.requestFullscreen) ytFrame.requestFullscreen();
      return;
    }
    if (wrap.requestFullscreen) wrap.requestFullscreen();
    else if (video.webkitEnterFullscreen) video.webkitEnterFullscreen();
  });

  video.addEventListener('playing', function () { setStatus('▶ Reproduzindo', 'ok'); });
  video.addEventListener('waiting', function () { setStatus('⏳ Carregando...', ''); });

  renderGrid();
})();
</script>
</body>
</html>
